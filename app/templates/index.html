<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toxic Comment Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Toxic Comment Detector</h1>
      <p class="sub">TF-IDF + Logistic Regression trained on 159k Wikipedia comments (Jigsaw). Scores six kinds of toxicity.</p>
    </header>

    <label for="comments" class="lbl">Comments - one per line</label>
    <textarea id="comments" rows="6" placeholder="Thanks for fixing the citation, great work!&#10;You are an idiot and nobody wants you here."></textarea>

    <div class="controls">
      <label for="threshold">Threshold <span id="thVal">0.50</span></label>
      <input type="range" id="threshold" min="0.1" max="0.9" step="0.05" value="0.5">
      <button id="run">Analyze</button>
    </div>

    <p id="status" class="status" role="status"></p>
    <section id="results"></section>
  </main>

  <script>window.LABEL_NAMES = {{ label_names | tojson }};</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
